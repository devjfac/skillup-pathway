# Parámetros de conexión JDBC del módulo de usuarios de SkillUp Pathway.
# Pueden sobrescribirse con las variables de entorno SKILLUP_DB_URL y SKILLUP_DB_USUARIO.
# La contraseña NO se escribe aquí: se toma de la variable de entorno SKILLUP_DB_CONTRASENA.
skillup.db.url=jdbc:mysql://localhost:3306/skillup?characterEncoding=UTF-8
skillup.db.usuario=skillup_app
