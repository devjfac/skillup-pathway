# Registro de errores técnicos en un archivo para no mezclar trazas con el menú de consola.
handlers=java.util.logging.FileHandler
.level=INFO
java.util.logging.FileHandler.pattern=skillup-usuarios.log
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.encoding=UTF-8
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s %3$s - %5$s%6$s%n
