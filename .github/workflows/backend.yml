# Integración continua del backend: verifica el estándar de codificación (Checkstyle),
# compila y ejecuta las pruebas unitarias y la prueba de integración JDBC contra MySQL 8.4.
name: Backend CI

on:
  push:
    branches: [main, develop, "feature/**"]
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, develop]

jobs:
  verificar:
    name: Checkstyle, compilación y pruebas
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          # Credenciales de un contenedor efímero que solo existe durante la ejecución.
          MYSQL_ROOT_PASSWORD: raiz_solo_ci
          MYSQL_DATABASE: skillup
          MYSQL_USER: skillup_app
          MYSQL_PASSWORD: clave_solo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -praiz_solo_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      SKILLUP_DB_URL: jdbc:mysql://127.0.0.1:3306/skillup
      SKILLUP_DB_USUARIO: skillup_app
      SKILLUP_DB_CONTRASENA: clave_solo_ci

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Crear el esquema de la base de datos
        working-directory: database/scripts
        run: |
          for script in *.sql; do
            echo "Ejecutando $script"
            mysql -h 127.0.0.1 -P 3306 -u root -praiz_solo_ci < "$script"
          done

      - name: Verificar estándar, compilar y probar
        working-directory: backend
        run: ./mvnw -B verify
